<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — AI College Assistant</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>

<div class="admin-shell">
  {% include "admin/_sidebar.html" %}

  <main class="admin-main">
    <header class="admin-topbar">
      <h1>Dashboard</h1>
      <div class="admin-user">Signed in as <strong>{{ username }}</strong></div>
    </header>

    <section class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-label">Total FAQs</div>
        <div class="stat-value" id="statFaqs">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Categories</div>
        <div class="stat-value" id="statCategories">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Queries</div>
        <div class="stat-value" id="statQueries">—</div>
      </div>
      <div class="stat-card stat-warn">
        <div class="stat-label">Unanswered Queries</div>
        <div class="stat-value" id="statUnanswered">—</div>
      </div>
    </section>

    <section class="admin-panel-block">
      <h2>Recent Queries</h2>
      <div class="table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Question</th>
              <th>Confidence</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="recentQueriesBody">
            <tr><td colspan="3" class="table-loading">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script>window.CSRF_TOKEN = {{ csrf_token|tojson }};</script>
<script src="{{ url_for('static', filename='js/admin.js') }}" data-page="dashboard"></script>
</body>
</html>
