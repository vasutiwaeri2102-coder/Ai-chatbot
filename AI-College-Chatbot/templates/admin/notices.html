<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Notices — AI College Assistant</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>

<div class="admin-shell">
  {% include "admin/_sidebar.html" %}

  <main class="admin-main">
    <header class="admin-topbar">
      <h1>Manage Notices</h1>
      <button class="primary-btn" id="addNoticeBtn">+ Add Notice</button>
    </header>

    <section class="admin-panel-block">
      <div class="table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Content</th>
              <th>Active</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="noticeTableBody">
            <tr><td colspan="4" class="table-loading">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<!-- Add / Edit Notice Modal -->
<div class="modal-overlay" id="noticeModalOverlay" hidden>
  <div class="modal">
    <h2 id="noticeModalTitle">Add Notice</h2>
    <form id="noticeForm">
      <input type="hidden" id="noticeId">

      <label for="noticeTitle">Title</label>
      <input type="text" id="noticeTitle" required maxlength="200">

      <label for="noticeContent">Content</label>
      <textarea id="noticeContent" rows="4" required></textarea>

      <label class="checkbox-label">
        <input type="checkbox" id="noticeActive" checked> Active (visible to students)
      </label>

      <div id="noticeFormError" class="login-error" hidden></div>

      <div class="modal-actions">
        <button type="button" class="secondary-btn" id="cancelNoticeBtn">Cancel</button>
        <button type="submit" class="primary-btn" id="saveNoticeBtn">Save Notice</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete confirmation modal -->
<div class="modal-overlay" id="deleteNoticeModalOverlay" hidden>
  <div class="modal modal-small">
    <h2>Delete Notice?</h2>
    <p>This action cannot be undone.</p>
    <div class="modal-actions">
      <button type="button" class="secondary-btn" id="cancelDeleteNoticeBtn">Cancel</button>
      <button type="button" class="danger-btn" id="confirmDeleteNoticeBtn">Delete</button>
    </div>
  </div>
</div>

<script>window.CSRF_TOKEN = {{ csrf_token|tojson }};</script>
<script src="{{ url_for('static', filename='js/admin.js') }}" data-page="notices"></script>
</body>
</html>
